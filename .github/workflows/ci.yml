          fi
          test "$(psql "${DATABASE_URL}" -tAc "SELECT count(*) FROM audit_events WHERE project_id = '${project_id}'")" -ge 10

  recovery-rehearsal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openrm
          POSTGRES_USER: openrm
          POSTGRES_PASSWORD: openrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrm -d openrm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://openrm:openrm@127.0.0.1:5432/openrm
      RECOVERY_DATABASE_URL: postgres://openrm:openrm@127.0.0.1:5432/openrm_recovery
      UPGRADE_DATABASE_URL: postgres://openrm:openrm@127.0.0.1:5432/openrm_recovery
      POSTGRES_HOST_PORT: "5432"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare source and isolated recovery databases
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          cargo run -p openrm-api --bin migrate
          docker exec "${POSTGRES_CONTAINER}" psql -U openrm -d postgres \
            -v ON_ERROR_STOP=1 -c 'CREATE DATABASE openrm_recovery'
      - name: Rehearse backup and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/rehearse-recovery.sh
      - name: Rehearse forward-only upgrade
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: bash scripts/rehearse-upgrade.sh

  production-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate production topology
        env:
          OPENRM_DATABASE_URL: postgres://openrm:password@postgres:5432/openrm
          OPENRM_OIDC_ISSUER: https://identity.example.invalid
          OPENRM_OIDC_AUDIENCE: openrm
          OPENRM_EVIDENCE_SIGNING_KEY: ci-artifact-validation-key-32-bytes-minimum
          OPENRM_EVIDENCE_SIGNING_KEY_ID: ci-artifact
          OPENRM_GRAFANA_ADMIN_PASSWORD: ci-grafana-placeholder
          OPENRM_POSTGRES_PASSWORD_FILE: /tmp/openrm-postgres-password
        run: |
          printf '%s' 'ci-postgres-placeholder' > /tmp/openrm-postgres-password
          docker compose -f deploy/compose.production.yaml config --quiet
      - name: Build production API image
        run: docker build --file deploy/openrm-api.Dockerfile --tag openrm-api:ci .

