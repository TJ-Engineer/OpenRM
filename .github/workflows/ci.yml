name: OpenRM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: openrm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:api
      - name: Verify generated API types
        run: git diff --exit-code -- src/api/generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  database-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openrm
          POSTGRES_USER: openrm
          POSTGRES_PASSWORD: openrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrm -d openrm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_MODE: dev
      API_BIND_ADDRESS: 127.0.0.1:8080
      DATABASE_URL: postgres://openrm:openrm@127.0.0.1:5432/openrm
      RUN_MIGRATIONS: "false"
      EVIDENCE_SIGNING_KEY: ci-phase-5-evidence-signing-key
      EVIDENCE_SIGNING_KEY_ID: ci-phase-5
      JIRA_API_TOKEN: ci-jira-placeholder-token
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p openrm-api --bin migrate
      - name: Exercise controlled requirements through pilot operations
        run: |
          set -euo pipefail
          cargo run -p openrm-api > /tmp/openrm-api.log 2>&1 &
          api_pid=$!
          trap 'kill ${api_pid}' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready > /tmp/ready.json; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              cat /tmp/openrm-api.log
              exit 1
            fi
            sleep 1
          done
          organization_id='00000000-0000-4000-8000-000000000001'
          base_url='http://127.0.0.1:8080/api/v1'
          request() {
            local method="$1"
            local token="$2"
            local url="$3"
            local data="${4:-}"
            local idempotency_key="${5:-}"
            local args=(--fail --silent -X "${method}"
              -H "Authorization: Bearer ${token}"
              -H "X-OpenRM-Organization: ${organization_id}")
            if [[ -n "${data}" ]]; then
              args+=(-H 'Content-Type: application/json' --data "${data}")
            fi
            if [[ -n "${idempotency_key}" ]]; then
              args+=(-H "X-Idempotency-Key: ${idempotency_key}")
            fi
            curl "${args[@]}" "${url}"
          }

          request GET 'dev:ci-admin' "${base_url}/session" > /tmp/session.json
          grep -q '"database":"available"' /tmp/session.json

          request POST 'dev:ci-admin' "${base_url}/projects" \
            '{"key":"CISLICE","name":"CI requirements slice","description":"Phase 2 runtime validation"}' \
            'ci-project-create-001' > /tmp/project.json
          project_id="$(jq -r '.id' /tmp/project.json)"
          request POST 'dev:ci-admin' "${base_url}/projects" \
            '{"key":"CIISO","name":"CI isolated project","description":"Project role boundary"}' \
            'ci-project-create-002' > /tmp/isolated-project.json
          isolated_project_id="$(jq -r '.id' /tmp/isolated-project.json)"

          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-author","role":"author"}' > /tmp/author.json
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-viewer","role":"viewer"}' > /tmp/viewer.json
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-reviewer","role":"reviewer"}' > /tmp/reviewer.json
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-approver","role":"reviewer"}' > /tmp/approver.json
          request GET 'dev:ci-admin' "${base_url}/projects/${project_id}/members" > /tmp/members.json
          test "$(jq -r '.items | length' /tmp/members.json)" -eq 5

          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/folders" \
            '{"name":"System requirements"}' > /tmp/folder.json
          folder_id="$(jq -r '.id' /tmp/folder.json)"
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/tags" \
            '{"name":"Safety","color":"#2563eb"}' > /tmp/tag.json
          tag_id="$(jq -r '.id' /tmp/tag.json)"
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/attribute-definitions" \
            '{"key":"mass","label":"Mass","value_type":"number","required":false}' > /tmp/attribute.json
          request POST 'dev:ci-author:author' "${base_url}/projects/${project_id}/workspace/saved-views" \
            '{"name":"Safety requirements","filters":{"tag_id":"'"${tag_id}"'"}}' > /tmp/saved-view.json

          api_url="${base_url}/projects/${project_id}/requirements"
          requirement_body='{"key":"CI-REQ-1","title":"CI requirement","statement":"The CI path shall persist controlled requirements.","attributes":{"priority":"high","mass":12.5},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request POST 'dev:ci-author:author' "${api_url}" "${requirement_body}" \
            'ci-requirement-create-001' > /tmp/requirement.json
          requirement_id="$(jq -r '.id' /tmp/requirement.json)"
          test "$(jq -r '.revision' /tmp/requirement.json)" -eq 1
          request POST 'dev:ci-author:author' "${api_url}" "${requirement_body}" \
            'ci-requirement-create-001' > /tmp/requirement-replay.json
          test "$(jq -r '.id' /tmp/requirement-replay.json)" = "${requirement_id}"

          revision_body='{"expected_revision":1,"title":"CI requirement revised","statement":"The CI path shall persist immutable requirement revisions.","attributes":{"priority":"critical","mass":12.7},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${revision_body}" \
            'ci-requirement-revise-001' > /tmp/requirement-revised.json
          test "$(jq -r '.revision' /tmp/requirement-revised.json)" -eq 2
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${revision_body}" \
            'ci-requirement-revise-001' > /tmp/requirement-revised-replay.json
          test "$(jq -r '.revision' /tmp/requirement-revised-replay.json)" -eq 2

          request GET 'dev:ci-author:author' \
            "${api_url}?search=immutable&folder_id=${folder_id}&tag_id=${tag_id}" > /tmp/requirements.json
          test "$(jq -r '.total' /tmp/requirements.json)" -eq 1
          request GET 'dev:ci-author:author' "${api_url}/${requirement_id}/revisions" > /tmp/revisions.json
          test "$(jq -r '.items | length' /tmp/revisions.json)" -eq 2
          request GET 'dev:ci-author:author' \
            "${api_url}/${requirement_id}/compare?from_revision=1&to_revision=2" > /tmp/comparison.json
          test "$(jq -r '.changed_fields | index("title") != null' /tmp/comparison.json)" = 'true'
          request GET 'dev:ci-author:author' "${api_url}/export" > /tmp/export.json
          test "$(jq -r '.total' /tmp/export.json)" -eq 1
          request POST 'dev:ci-author:author' "${api_url}/import" \
            '{"items":[{"key":"CI-IMP-1","title":"Imported requirement","statement":"The workspace shall import controlled requirements.","attributes":{"priority":"medium","mass":1},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}]}' \
            'ci-requirement-import-001' > /tmp/import.json
          test "$(jq -r '.imported' /tmp/import.json)" -eq 1
          imported_requirement_id="$(jq -r '.items[0].id' /tmp/import.json)"

          target_body='{"key":"CI-REQ-2","title":"Trace target","statement":"The target requirement shall retain exact trace revision evidence.","attributes":{"priority":"high","mass":2},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request POST 'dev:ci-author:author' "${api_url}" "${target_body}" \
            'ci-requirement-create-002' > /tmp/trace-target.json
          target_requirement_id="$(jq -r '.id' /tmp/trace-target.json)"
          relationships_url="${base_url}/projects/${project_id}/relationships"
          request GET 'dev:ci-author:author' \
            "${base_url}/projects/${project_id}/relationship-types" > /tmp/relationship-types.json
          decomposition_type_id="$(jq -r '.items[] | select(.key == "DECOMPOSES_TO") | .id' /tmp/relationship-types.json)"
          test -n "${decomposition_type_id}"
          relationship_body='{"relationship_type_id":"'"${decomposition_type_id}"'","source_artifact_id":"'"${requirement_id}"'","target_artifact_id":"'"${target_requirement_id}"'"}'
          request POST 'dev:ci-author:author' "${relationships_url}" "${relationship_body}" \
            'ci-relationship-create-001' > /tmp/relationship.json
          relationship_id="$(jq -r '.id' /tmp/relationship.json)"
          test "$(jq -r '.source_revision' /tmp/relationship.json)" -eq 2
          test "$(jq -r '.target_revision' /tmp/relationship.json)" -eq 1
          request POST 'dev:ci-author:author' "${relationships_url}" "${relationship_body}" \
            'ci-relationship-create-001' > /tmp/relationship-replay.json
          test "$(jq -r '.id' /tmp/relationship-replay.json)" = "${relationship_id}"
          request GET 'dev:ci-author:author' \
            "${relationships_url}?artifact_id=${requirement_id}&direction=source" > /tmp/outgoing-relationships.json
          test "$(jq -r '.items | length' /tmp/outgoing-relationships.json)" -eq 1
          test "$(jq -r '.items[0].relationship_type_key' /tmp/outgoing-relationships.json)" = 'DECOMPOSES_TO'

          cardinality_status="$(curl --silent --output /tmp/cardinality.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-relationship-cardinality' -H 'Content-Type: application/json' \
            --data '{"relationship_type_id":"'"${decomposition_type_id}"'","source_artifact_id":"'"${imported_requirement_id}"'","target_artifact_id":"'"${target_requirement_id}"'"}' \
            "${relationships_url}")"
          test "${cardinality_status}" = '409'

          impact_revision_body='{"expected_revision":2,"title":"CI requirement impact change","statement":"The CI path shall propagate suspect relationship impact asynchronously.","attributes":{"priority":"critical","mass":12.8},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${impact_revision_body}" \
            'ci-requirement-impact-001' > /tmp/requirement-impact.json
          for attempt in {1..30}; do
            request GET 'dev:ci-author:author' \
              "${relationships_url}?artifact_id=${requirement_id}&direction=source" > /tmp/suspect-relationships.json
            if [[ "$(jq -r '.items[0].suspect' /tmp/suspect-relationships.json)" = 'true' ]]; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo 'Relationship did not become suspect' >&2
              exit 1
            fi
            sleep 1
          done
          test "$(jq -r '.items[0].version' /tmp/suspect-relationships.json)" -eq 2
          test "$(jq -r '.items[0].source_revision' /tmp/suspect-relationships.json)" -eq 3
          request POST 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/resolve" \
            '{"expected_version":2,"disposition":"Downstream intent remains valid after impact review."}' \
            'ci-relationship-resolve-001' > /tmp/resolved-relationship.json
          test "$(jq -r '.suspect' /tmp/resolved-relationship.json)" = 'false'
          test "$(jq -r '.version' /tmp/resolved-relationship.json)" -eq 3
          test "$(jq -r '.disposition' /tmp/resolved-relationship.json)" = \
            'Downstream intent remains valid after impact review.'
          request POST 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/resolve" \
            '{"expected_version":2,"disposition":"Downstream intent remains valid after impact review."}' \
            'ci-relationship-resolve-001' > /tmp/resolved-relationship-replay.json
          test "$(jq -r '.version' /tmp/resolved-relationship-replay.json)" -eq 3
          request GET 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/revisions" > /tmp/relationship-revisions.json
          test "$(jq -r '.items | length' /tmp/relationship-revisions.json)" -eq 3
          test "$(jq -r '.items[0].created_by' /tmp/relationship-revisions.json)" = 'ci-reviewer'
          test "$(jq -r '.items[1].created_by' /tmp/relationship-revisions.json)" = \
            'system:relationship-impact'

          trace_url="${base_url}/projects/${project_id}/trace"
          request GET 'dev:ci-viewer:viewer' "${trace_url}/summary" > /tmp/trace-summary.json
          test "$(jq -r '.total_artifacts' /tmp/trace-summary.json)" -eq 3
          test "$(jq -r '.covered_artifacts' /tmp/trace-summary.json)" -eq 2
          test "$(jq -r '.orphan_artifacts' /tmp/trace-summary.json)" -eq 1
          test "$(jq -r '.relationships' /tmp/trace-summary.json)" -eq 1
          test "$(jq -r '.suspect_relationships' /tmp/trace-summary.json)" -eq 0
          test "$(jq -r '.coverage_percent' /tmp/trace-summary.json)" = '66.67'
          request GET 'dev:ci-viewer:viewer' "${trace_url}/matrix" > /tmp/trace-matrix.json
          test "$(jq -r '.items[] | select(.key == "CI-IMP-1") | .gap' /tmp/trace-matrix.json)" = 'true'
          test "$(jq -r '.items[] | select(.key == "CI-REQ-1") | .downstream_count' /tmp/trace-matrix.json)" -eq 1
          request GET 'dev:ci-viewer:viewer' "${trace_url}/graph" > /tmp/trace-graph.json
          test "$(jq -r '.nodes | length' /tmp/trace-graph.json)" -eq 3
          test "$(jq -r '.edges | length' /tmp/trace-graph.json)" -eq 1

          changesets_url="${base_url}/projects/${project_id}/changesets"
          request POST 'dev:ci-author:author' "${changesets_url}" \
            '{"message":"Capture resolved trace state"}' \
            'ci-changeset-create-001' > /tmp/changeset-1.json
          changeset_1_id="$(jq -r '.id' /tmp/changeset-1.json)"
          test "$(jq -r '.sequence' /tmp/changeset-1.json)" -eq 1
          test "$(jq -r '.added' /tmp/changeset-1.json)" -eq 3
          test "$(jq -r '.modified' /tmp/changeset-1.json)" -eq 0
          request POST 'dev:ci-author:author' "${changesets_url}" \
            '{"message":"Capture resolved trace state"}' \
            'ci-changeset-create-001' > /tmp/changeset-1-replay.json
          test "$(jq -r '.id' /tmp/changeset-1-replay.json)" = "${changeset_1_id}"

          baselines_url="${base_url}/projects/${project_id}/baselines"
          author_baseline_status="$(curl --silent --output /tmp/author-baseline.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-author-baseline-denied' -H 'Content-Type: application/json' \
            --data '{"name":"Author denied","changeset_id":"'"${changeset_1_id}"'","supersedes_baseline_id":null}' \
            "${baselines_url}")"
          test "${author_baseline_status}" = '403'
          request POST 'dev:ci-reviewer:reviewer' "${baselines_url}" \
            '{"name":"Trace state 1","changeset_id":"'"${changeset_1_id}"'","supersedes_baseline_id":null}' \
            'ci-baseline-create-001' > /tmp/baseline-1.json
          baseline_1_id="$(jq -r '.id' /tmp/baseline-1.json)"
          test "$(jq -r '.artifact_count' /tmp/baseline-1.json)" -eq 3
          test "$(jq -r '.relationship_count' /tmp/baseline-1.json)" -eq 1
          test "$(jq -r '.manifest_hash | length' /tmp/baseline-1.json)" -eq 64
          test "$(jq -r '.signature | length' /tmp/baseline-1.json)" -eq 64

          target_revision_body='{"expected_revision":1,"title":"Trace target revised","statement":"The target requirement shall retain updated exact trace evidence.","attributes":{"priority":"high","mass":2.1},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${target_requirement_id}" "${target_revision_body}" \
            'ci-target-revise-001' > /tmp/target-revised.json
          second_impact_body='{"expected_revision":3,"title":"CI requirement second impact","statement":"The CI path shall refresh exact endpoint revisions for the signed baseline.","attributes":{"priority":"critical","mass":12.9},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${second_impact_body}" \
            'ci-requirement-impact-002' > /tmp/requirement-impact-2.json
          for attempt in {1..30}; do
            request GET 'dev:ci-author:author' \
              "${relationships_url}?artifact_id=${requirement_id}&direction=source" > /tmp/suspect-relationships-2.json
            if [[ "$(jq -r '.items[0].suspect' /tmp/suspect-relationships-2.json)" = 'true' ]]; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo 'Relationship did not become suspect after the second impact' >&2
              exit 1
            fi
            sleep 1
          done
          test "$(jq -r '.items[0].source_revision' /tmp/suspect-relationships-2.json)" -eq 4
          test "$(jq -r '.items[0].target_revision' /tmp/suspect-relationships-2.json)" -eq 2
          second_relationship_version="$(jq -r '.items[0].version' /tmp/suspect-relationships-2.json)"
          request POST 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/resolve" \
            '{"expected_version":'"${second_relationship_version}"',"disposition":"Both exact endpoint revisions reviewed for the superseding baseline."}' \
            'ci-relationship-resolve-002' > /tmp/resolved-relationship-2.json
          test "$(jq -r '.suspect' /tmp/resolved-relationship-2.json)" = 'false'

          request POST 'dev:ci-author:author' "${changesets_url}" \
            '{"message":"Refresh both traced endpoint revisions"}' \
            'ci-changeset-create-002' > /tmp/changeset-2.json
          changeset_2_id="$(jq -r '.id' /tmp/changeset-2.json)"
          test "$(jq -r '.sequence' /tmp/changeset-2.json)" -eq 2
          test "$(jq -r '.parent_changeset_id' /tmp/changeset-2.json)" = "${changeset_1_id}"
          test "$(jq -r '.modified' /tmp/changeset-2.json)" -eq 2
          test "$(jq -r '.unchanged' /tmp/changeset-2.json)" -eq 1
          request GET 'dev:ci-viewer:viewer' "${changesets_url}/${changeset_2_id}" > /tmp/changeset-2-read.json
          test "$(jq -r '.entries | map(select(.change_type == "modified")) | length' /tmp/changeset-2-read.json)" -eq 2

          request POST 'dev:ci-reviewer:reviewer' "${baselines_url}" \
            '{"name":"Trace state 2","changeset_id":"'"${changeset_2_id}"'","supersedes_baseline_id":"'"${baseline_1_id}"'"}' \
            'ci-baseline-create-002' > /tmp/baseline-2.json
          baseline_2_id="$(jq -r '.id' /tmp/baseline-2.json)"
          test "$(jq -r '.sequence' /tmp/baseline-2.json)" -eq 2
          test "$(jq -r '.supersedes_baseline_id' /tmp/baseline-2.json)" = "${baseline_1_id}"
          request GET 'dev:ci-viewer:viewer' \
            "${baselines_url}/compare?from_baseline_id=${baseline_1_id}&to_baseline_id=${baseline_2_id}" \
            > /tmp/baseline-comparison.json
          test "$(jq -r '.artifacts_modified | sort | join(",")' /tmp/baseline-comparison.json)" = 'CI-REQ-1,CI-REQ-2'
          test "$(jq -r '.relationships_changed' /tmp/baseline-comparison.json)" -eq 1

          evidence_url="${baselines_url}/${baseline_2_id}/evidence"
          request GET 'dev:ci-viewer:viewer' "${evidence_url}" > /tmp/evidence-1.json
          request GET 'dev:ci-viewer:viewer' "${evidence_url}" > /tmp/evidence-2.json
          cmp /tmp/evidence-1.json /tmp/evidence-2.json
          test "$(jq -r '.signature_valid' /tmp/evidence-1.json)" = 'true'
          test "$(jq -r '.schema_version' /tmp/evidence-1.json)" = 'openrm-evidence-v1'
          test "$(jq -r '.signing_algorithm' /tmp/evidence-1.json)" = 'HMAC-SHA256'
          test "$(jq -r '.signing_key_id' /tmp/evidence-1.json)" = 'ci-phase-5'
          test "$(jq -r '.manifest.artifacts | length' /tmp/evidence-1.json)" -eq 3
          test "$(jq -r '.manifest.relationships | length' /tmp/evidence-1.json)" -eq 1

          reviews_url="${base_url}/projects/${project_id}/reviews"
          review_body='{"baseline_id":"'"${baseline_2_id}"'","title":"CI baseline review","description":"Protected Phase 4 decision evidence","required_approvals":1}'
          request POST 'dev:ci-author:author' "${reviews_url}" "${review_body}" \
            'ci-review-create-001' > /tmp/review.json
          review_id="$(jq -r '.review_id' /tmp/review.json)"
          test "$(jq -r '.status' /tmp/review.json)" = 'draft'
          request POST 'dev:ci-author:author' "${reviews_url}" "${review_body}" \
            'ci-review-create-001' > /tmp/review-replay.json
          test "$(jq -r '.review_id' /tmp/review-replay.json)" = "${review_id}"

          participants_url="${reviews_url}/${review_id}/participants"
          request POST 'dev:ci-author:author' "${participants_url}" \
            '{"subject":"ci-reviewer","role_label":"Baseline creator","required":false}' \
            'ci-review-participant-001' > /tmp/review-baseline-creator.json
          request POST 'dev:ci-author:author' "${participants_url}" \
            '{"subject":"ci-approver","role_label":"Independent approver","required":true}' \
            'ci-review-participant-002' > /tmp/review-approver.json
          invalid_participant_status="$(curl --silent --output /tmp/review-invalid-participant.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-review-participant-invalid' -H 'Content-Type: application/json' \
            --data '{"subject":"ci-viewer","role_label":"Invalid reviewer","required":true}' \
            "${participants_url}")"
          test "${invalid_participant_status}" = '400'

          request POST 'dev:ci-author:author' "${reviews_url}/${review_id}/start" \
            '{"rationale":"Independent reviewer and immutable scope are ready."}' \
            'ci-review-start-001' > /tmp/review-start.json
          test "$(jq -r '.status' /tmp/review-start.json)" = 'in_review'
          test "$(jq -r '.current_round' /tmp/review-start.json)" -eq 1
          request POST 'dev:ci-author:author' "${reviews_url}/${review_id}/start" \
            '{"rationale":"Independent reviewer and immutable scope are ready."}' \
            'ci-review-start-001' > /tmp/review-start-replay.json
          test "$(jq -r '.current_round' /tmp/review-start-replay.json)" -eq 1

          sod_status="$(curl --silent --output /tmp/review-sod-denied.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-reviewer:reviewer' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-review-sod-denied' -H 'Content-Type: application/json' \
            --data '{"decision":"approved","comment":"Baseline creators cannot approve their own evidence."}' \
            "${reviews_url}/${review_id}/decisions")"
          test "${sod_status}" = '403'

          request POST 'dev:ci-approver:reviewer' "${reviews_url}/${review_id}/comments" \
            '{"target_artifact_id":"'"${requirement_id}"'","body":"Attach the independent safety analysis.","blocking":true}' \
            'ci-review-comment-001' > /tmp/review-comment.json
          review_comment_id="$(jq -r '.id' /tmp/review-comment.json)"
