name: OpenRM CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: openrm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run generate:api
      - name: Verify generated API types
        run: git diff --exit-code -- src/api/generated.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm audit --audit-level=high

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets
      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked
          cargo audit

  database-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openrm
          POSTGRES_USER: openrm
          POSTGRES_PASSWORD: openrm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openrm -d openrm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      APP_ENV: test
      AUTH_MODE: dev
      API_BIND_ADDRESS: 127.0.0.1:8080
      DATABASE_URL: postgres://openrm:openrm@127.0.0.1:5432/openrm
      RUN_MIGRATIONS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p openrm-api --bin migrate
      - name: Exercise requirements and typed traceability paths
        run: |
          set -euo pipefail
          cargo run -p openrm-api > /tmp/openrm-api.log 2>&1 &
          api_pid=$!
          trap 'kill ${api_pid}' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready > /tmp/ready.json; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              cat /tmp/openrm-api.log
              exit 1
            fi
            sleep 1
          done
          organization_id='00000000-0000-4000-8000-000000000001'
          base_url='http://127.0.0.1:8080/api/v1'
          request() {
            local method="$1"
            local token="$2"
            local url="$3"
            local data="${4:-}"
            local idempotency_key="${5:-}"
            local args=(--fail --silent -X "${method}"
              -H "Authorization: Bearer ${token}"
              -H "X-OpenRM-Organization: ${organization_id}")
            if [[ -n "${data}" ]]; then
              args+=(-H 'Content-Type: application/json' --data "${data}")
            fi
            if [[ -n "${idempotency_key}" ]]; then
              args+=(-H "X-Idempotency-Key: ${idempotency_key}")
            fi
            curl "${args[@]}" "${url}"
          }

          request GET 'dev:ci-admin' "${base_url}/session" > /tmp/session.json
          grep -q '"database":"available"' /tmp/session.json

          request POST 'dev:ci-admin' "${base_url}/projects" \
            '{"key":"CISLICE","name":"CI requirements slice","description":"Phase 2 runtime validation"}' \
            'ci-project-create-001' > /tmp/project.json
          project_id="$(jq -r '.id' /tmp/project.json)"
          request POST 'dev:ci-admin' "${base_url}/projects" \
            '{"key":"CIISO","name":"CI isolated project","description":"Project role boundary"}' \
            'ci-project-create-002' > /tmp/isolated-project.json
          isolated_project_id="$(jq -r '.id' /tmp/isolated-project.json)"

          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-author","role":"author"}' > /tmp/author.json
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-viewer","role":"viewer"}' > /tmp/viewer.json
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/members" \
            '{"subject":"ci-reviewer","role":"reviewer"}' > /tmp/reviewer.json
          request GET 'dev:ci-admin' "${base_url}/projects/${project_id}/members" > /tmp/members.json
          test "$(jq -r '.items | length' /tmp/members.json)" -eq 4

          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/folders" \
            '{"name":"System requirements"}' > /tmp/folder.json
          folder_id="$(jq -r '.id' /tmp/folder.json)"
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/tags" \
            '{"name":"Safety","color":"#2563eb"}' > /tmp/tag.json
          tag_id="$(jq -r '.id' /tmp/tag.json)"
          request POST 'dev:ci-admin' "${base_url}/projects/${project_id}/workspace/attribute-definitions" \
            '{"key":"mass","label":"Mass","value_type":"number","required":false}' > /tmp/attribute.json
          request POST 'dev:ci-author:author' "${base_url}/projects/${project_id}/workspace/saved-views" \
            '{"name":"Safety requirements","filters":{"tag_id":"'"${tag_id}"'"}}' > /tmp/saved-view.json

          api_url="${base_url}/projects/${project_id}/requirements"
          requirement_body='{"key":"CI-REQ-1","title":"CI requirement","statement":"The CI path shall persist controlled requirements.","attributes":{"priority":"high","mass":12.5},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request POST 'dev:ci-author:author' "${api_url}" "${requirement_body}" \
            'ci-requirement-create-001' > /tmp/requirement.json
          requirement_id="$(jq -r '.id' /tmp/requirement.json)"
          test "$(jq -r '.revision' /tmp/requirement.json)" -eq 1
          request POST 'dev:ci-author:author' "${api_url}" "${requirement_body}" \
            'ci-requirement-create-001' > /tmp/requirement-replay.json
          test "$(jq -r '.id' /tmp/requirement-replay.json)" = "${requirement_id}"

          revision_body='{"expected_revision":1,"title":"CI requirement revised","statement":"The CI path shall persist immutable requirement revisions.","attributes":{"priority":"critical","mass":12.7},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${revision_body}" \
            'ci-requirement-revise-001' > /tmp/requirement-revised.json
          test "$(jq -r '.revision' /tmp/requirement-revised.json)" -eq 2
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${revision_body}" \
            'ci-requirement-revise-001' > /tmp/requirement-revised-replay.json
          test "$(jq -r '.revision' /tmp/requirement-revised-replay.json)" -eq 2

          request GET 'dev:ci-author:author' \
            "${api_url}?search=immutable&folder_id=${folder_id}&tag_id=${tag_id}" > /tmp/requirements.json
          test "$(jq -r '.total' /tmp/requirements.json)" -eq 1
          request GET 'dev:ci-author:author' "${api_url}/${requirement_id}/revisions" > /tmp/revisions.json
          test "$(jq -r '.items | length' /tmp/revisions.json)" -eq 2
          request GET 'dev:ci-author:author' \
            "${api_url}/${requirement_id}/compare?from_revision=1&to_revision=2" > /tmp/comparison.json
          test "$(jq -r '.changed_fields | index("title") != null' /tmp/comparison.json)" = 'true'
          request GET 'dev:ci-author:author' "${api_url}/export" > /tmp/export.json
          test "$(jq -r '.total' /tmp/export.json)" -eq 1
          request POST 'dev:ci-author:author' "${api_url}/import" \
            '{"items":[{"key":"CI-IMP-1","title":"Imported requirement","statement":"The workspace shall import controlled requirements.","attributes":{"priority":"medium","mass":1},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}]}' \
            'ci-requirement-import-001' > /tmp/import.json
          test "$(jq -r '.imported' /tmp/import.json)" -eq 1
          imported_requirement_id="$(jq -r '.items[0].id' /tmp/import.json)"

          target_body='{"key":"CI-REQ-2","title":"Trace target","statement":"The target requirement shall retain exact trace revision evidence.","attributes":{"priority":"high","mass":2},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request POST 'dev:ci-author:author' "${api_url}" "${target_body}" \
            'ci-requirement-create-002' > /tmp/trace-target.json
          target_requirement_id="$(jq -r '.id' /tmp/trace-target.json)"
          relationships_url="${base_url}/projects/${project_id}/relationships"
          request GET 'dev:ci-author:author' \
            "${base_url}/projects/${project_id}/relationship-types" > /tmp/relationship-types.json
          decomposition_type_id="$(jq -r '.items[] | select(.key == "DECOMPOSES_TO") | .id' /tmp/relationship-types.json)"
          test -n "${decomposition_type_id}"
          relationship_body='{"relationship_type_id":"'"${decomposition_type_id}"'","source_artifact_id":"'"${requirement_id}"'","target_artifact_id":"'"${target_requirement_id}"'"}'
          request POST 'dev:ci-author:author' "${relationships_url}" "${relationship_body}" \
            'ci-relationship-create-001' > /tmp/relationship.json
          relationship_id="$(jq -r '.id' /tmp/relationship.json)"
          test "$(jq -r '.source_revision' /tmp/relationship.json)" -eq 2
          test "$(jq -r '.target_revision' /tmp/relationship.json)" -eq 1
          request POST 'dev:ci-author:author' "${relationships_url}" "${relationship_body}" \
            'ci-relationship-create-001' > /tmp/relationship-replay.json
          test "$(jq -r '.id' /tmp/relationship-replay.json)" = "${relationship_id}"
          request GET 'dev:ci-author:author' \
            "${relationships_url}?artifact_id=${requirement_id}&direction=source" > /tmp/outgoing-relationships.json
          test "$(jq -r '.items | length' /tmp/outgoing-relationships.json)" -eq 1
          test "$(jq -r '.items[0].relationship_type_key' /tmp/outgoing-relationships.json)" = 'DECOMPOSES_TO'

          cardinality_status="$(curl --silent --output /tmp/cardinality.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-relationship-cardinality' -H 'Content-Type: application/json' \
            --data '{"relationship_type_id":"'"${decomposition_type_id}"'","source_artifact_id":"'"${imported_requirement_id}"'","target_artifact_id":"'"${target_requirement_id}"'"}' \
            "${relationships_url}")"
          test "${cardinality_status}" = '409'

          impact_revision_body='{"expected_revision":2,"title":"CI requirement impact change","statement":"The CI path shall propagate suspect relationship impact asynchronously.","attributes":{"priority":"critical","mass":12.8},"folder_id":"'"${folder_id}"'","tag_ids":["'"${tag_id}"'"]}'
          request PUT 'dev:ci-author:author' "${api_url}/${requirement_id}" "${impact_revision_body}" \
            'ci-requirement-impact-001' > /tmp/requirement-impact.json
          for attempt in {1..30}; do
            request GET 'dev:ci-author:author' \
              "${relationships_url}?artifact_id=${requirement_id}&direction=source" > /tmp/suspect-relationships.json
            if [[ "$(jq -r '.items[0].suspect' /tmp/suspect-relationships.json)" = 'true' ]]; then
              break
            fi
            if [[ "${attempt}" -eq 30 ]]; then
              echo 'Relationship did not become suspect' >&2
              exit 1
            fi
            sleep 1
          done
          test "$(jq -r '.items[0].version' /tmp/suspect-relationships.json)" -eq 2
          test "$(jq -r '.items[0].source_revision' /tmp/suspect-relationships.json)" -eq 3
          request POST 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/resolve" \
            '{"expected_version":2,"disposition":"Downstream intent remains valid after impact review."}' \
            'ci-relationship-resolve-001' > /tmp/resolved-relationship.json
          test "$(jq -r '.suspect' /tmp/resolved-relationship.json)" = 'false'
          test "$(jq -r '.version' /tmp/resolved-relationship.json)" -eq 3
          test "$(jq -r '.disposition' /tmp/resolved-relationship.json)" = \
            'Downstream intent remains valid after impact review.'
          request POST 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/resolve" \
            '{"expected_version":2,"disposition":"Downstream intent remains valid after impact review."}' \
            'ci-relationship-resolve-001' > /tmp/resolved-relationship-replay.json
          test "$(jq -r '.version' /tmp/resolved-relationship-replay.json)" -eq 3
          request GET 'dev:ci-reviewer:reviewer' \
            "${relationships_url}/${relationship_id}/revisions" > /tmp/relationship-revisions.json
          test "$(jq -r '.items | length' /tmp/relationship-revisions.json)" -eq 3
          test "$(jq -r '.items[0].created_by' /tmp/relationship-revisions.json)" = 'ci-reviewer'
          test "$(jq -r '.items[1].created_by' /tmp/relationship-revisions.json)" = \
            'system:relationship-impact'

          request GET 'dev:ci-viewer:viewer' "${api_url}" > /tmp/viewer-list.json
          viewer_status="$(curl --silent --output /tmp/viewer-write.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-viewer:viewer' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-viewer-denied' -H 'Content-Type: application/json' \
            --data '{"key":"DENIED-1","title":"Denied","statement":"Viewer writes shall be denied.","attributes":{"priority":"low"},"folder_id":null,"tag_ids":[]}' \
            "${api_url}")"
          test "${viewer_status}" = '403'
          relationship_viewer_status="$(curl --silent --output /tmp/relationship-viewer-write.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-viewer:viewer' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-relationship-viewer-denied' -H 'Content-Type: application/json' \
            --data "${relationship_body}" "${relationships_url}")"
          test "${relationship_viewer_status}" = '403'
          author_resolution_status="$(curl --silent --output /tmp/relationship-author-resolution.json --write-out '%{http_code}' \
            -X POST -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            -H 'X-Idempotency-Key: ci-relationship-author-resolution' -H 'Content-Type: application/json' \
            --data '{"expected_version":3,"disposition":"Authors cannot resolve impact."}' \
            "${relationships_url}/${relationship_id}/resolve")"
          test "${author_resolution_status}" = '403'
          isolation_status="$(curl --silent --output /tmp/project-isolation.json --write-out '%{http_code}' \
            -H 'Authorization: Bearer dev:ci-author:author' \
            -H "X-OpenRM-Organization: ${organization_id}" \
            "${base_url}/projects/${isolated_project_id}/requirements")"
          test "${isolation_status}" = '403'
          request GET 'dev:ci-author:author' "${base_url}/projects" > /tmp/author-projects.json
          test "$(jq -r '.items | length' /tmp/author-projects.json)" -eq 1

          if psql "${DATABASE_URL}" -c \
            "UPDATE audit_events SET event_type = 'tampered' WHERE aggregate_id = '${requirement_id}'"; then
            echo 'Audit history accepted an update' >&2
            exit 1
          fi
          if psql "${DATABASE_URL}" -c \
            "UPDATE artifact_revisions SET title = 'tampered' WHERE artifact_id = '${requirement_id}'"; then
            echo 'Revision history accepted an update' >&2
            exit 1
          fi
          if psql "${DATABASE_URL}" -c \
            "UPDATE relationship_revisions SET suspect = true WHERE relationship_id = '${relationship_id}'"; then
            echo 'Relationship history accepted an update' >&2
            exit 1
          fi
          test "$(psql "${DATABASE_URL}" -tAc "SELECT count(*) FROM audit_events WHERE project_id = '${project_id}'")" -ge 10

