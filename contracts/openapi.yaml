openapi: 3.1.0
info:
  title: OpenRM API
  version: 0.1.0
  description: >-
    Versioned foundation contract for OpenRM. All controlled product endpoints
    live under /api/v1; health and readiness endpoints remain operational.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Operations
  - name: Identity
  - name: Projects
  - name: Requirements
  - name: Traceability
  - name: Controlled Change
  - name: Baselines
  - name: Reviews
  - name: Verification
  - name: Connectors
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Report process liveness and build metadata
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Verify that required dependencies are available
      responses:
        "200":
          description: The service and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/session:
    get:
      operationId: getSession
      tags: [Identity]
      summary: Verify authentication, tenant scope, policy, and database access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Authenticated principal and database status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects in the selected organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Tenant-scoped projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project with its default requirement workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Idempotent replay of a prior project command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listProjectMemberships
      tags: [Projects]
      summary: List project-scoped roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: setProjectMembership
      tags: [Projects]
      summary: Assign or replace a project-scoped role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipRequest"
      responses:
        "200":
          description: Membership assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/workspace/{resource}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkspaceResource"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listWorkspaceResources
      tags: [Projects]
      summary: List folders, tags, attribute definitions, or saved views
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createWorkspaceResource
      tags: [Projects]
      summary: Create a folder, tag, attribute definition, or saved view
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResourceRequest"
      responses:
        "201":
          description: Workspace resource created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirements
      tags: [Requirements]
      summary: Search and page through current requirements
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current requirement results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRequirement
      tags: [Requirements]
      summary: Create a controlled requirement and its first revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementRequest"
      responses:
        "200":
          description: Idempotent replay of an existing successful command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "201":
          description: Requirement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getRequirement
      tags: [Requirements]
      summary: Read the current materialized requirement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: reviseRequirement
      tags: [Requirements]
      summary: Append a revision using optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseRequirementRequest"
      responses:
        "200":
          description: Revised requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirementRevisions
      tags: [Requirements]
      summary: List immutable requirement revisions newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requirement revision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}/compare:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: compareRequirementRevisions
      tags: [Requirements]
      summary: Compare two immutable requirement revisions
      security:
        - bearerAuth: []
      parameters:
        - name: from_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: to_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Revision comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/import:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
      - $ref: "#/components/parameters/IdempotencyHeader"
    post:
      operationId: importRequirements
      tags: [Requirements]
      summary: Import up to 100 requirements using idempotent row commands
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementImportRequest"
      responses:
        "201":
          description: Imported requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/export:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: exportRequirements
      tags: [Requirements]
      summary: Export all current requirements as JSON
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complete current requirement export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationship-types:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationshipTypes
      tags: [Traceability]
      summary: List directed relationship rules configured for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped relationship types and cardinality rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipTypeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationships
      tags: [Traceability]
      summary: List directed relationships, optionally around one artifact
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: query
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          description: Source means outgoing; target means incoming.
          schema:
            type: string
            enum: [both, source, target]
            default: both
      responses:
        "200":
          description: Current typed relationships bound to exact endpoint revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRelationship
      tags: [Traceability]
      summary: Create a directed relationship at the endpoints' current revisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipRequest"
      responses:
        "200":
          description: Idempotent replay of an existing successful command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "201":
          description: Directed relationship created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships/{relationship_id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/OrganizationHeader"
      - $ref: "#/components/parameters/IdempotencyHeader"
    post:
      operationId: resolveSuspectRelationship
      tags: [Traceability]
      summary: Record a reviewer disposition against exact endpoint revisions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRelationshipRequest"
      responses:
        "200":
          description: Suspect impact resolved, or an idempotent replay returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships/{relationship_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationshipRevisions
      tags: [Traceability]
      summary: List immutable relationship versions newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attributable relationship version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/trace/summary:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getTraceSummary
      tags: [Traceability]
      summary: Calculate trace coverage, gaps, relationships, and suspect impact
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current project trace coverage summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/trace/matrix:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getTraceMatrix
      tags: [Traceability]
      summary: List artifact trace counts and gap state
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current project trace matrix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceMatrixResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/trace/graph:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getTraceGraph
      tags: [Traceability]
      summary: Read graph nodes, exact directed edges, and coverage
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current project trace graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraceGraph"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/changesets:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listChangesets
      tags: [Controlled Change]
      summary: List immutable attributable project snapshots
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Changesets newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createChangeset
      tags: [Controlled Change]
      summary: Snapshot current artifact revisions with parent-relative diffs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangesetRequest"
      responses:
        "200":
          description: Idempotent replay of a successful changeset command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        "201":
          description: Changeset created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/changesets/{changeset_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/ChangesetId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getChangeset
      tags: [Controlled Change]
      summary: Read an immutable changeset and its artifact diff entries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attributable changeset snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/baselines:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
