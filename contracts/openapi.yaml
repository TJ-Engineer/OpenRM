openapi: 3.1.0
info:
  title: OpenRM API
  version: 0.1.0
  description: >-
    Versioned foundation contract for OpenRM. All controlled product endpoints
    live under /api/v1; health and readiness endpoints remain operational.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Operations
  - name: Identity
  - name: Projects
  - name: Requirements
  - name: Traceability
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Report process liveness and build metadata
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Verify that required dependencies are available
      responses:
        "200":
          description: The service and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/session:
    get:
      operationId: getSession
      tags: [Identity]
      summary: Verify authentication, tenant scope, policy, and database access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Authenticated principal and database status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects in the selected organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Tenant-scoped projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a project with its default requirement workspace
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "200":
          description: Idempotent replay of a prior project command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "201":
          description: Project created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/members:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listProjectMemberships
      tags: [Projects]
      summary: List project-scoped roles
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project memberships.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembershipListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: setProjectMembership
      tags: [Projects]
      summary: Assign or replace a project-scoped role
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMembershipRequest"
      responses:
        "200":
          description: Membership assigned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/workspace/{resource}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/WorkspaceResource"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listWorkspaceResources
      tags: [Projects]
      summary: List folders, tags, attribute definitions, or saved views
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceResourceListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createWorkspaceResource
      tags: [Projects]
      summary: Create a folder, tag, attribute definition, or saved view
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceResourceRequest"
      responses:
        "201":
          description: Workspace resource created.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirements
      tags: [Requirements]
      summary: Search and page through current requirements
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: folder_id
          in: query
          schema:
            type: string
            format: uuid
        - name: tag_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current requirement results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRequirement
      tags: [Requirements]
      summary: Create a controlled requirement and its first revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementRequest"
      responses:
        "200":
          description: Idempotent replay of an existing successful command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "201":
          description: Requirement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getRequirement
      tags: [Requirements]
      summary: Read the current materialized requirement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: reviseRequirement
      tags: [Requirements]
      summary: Append a revision using optimistic concurrency
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseRequirementRequest"
      responses:
        "200":
          description: Revised requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirementRevisions
      tags: [Requirements]
      summary: List immutable requirement revisions newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requirement revision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}/compare:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: compareRequirementRevisions
      tags: [Requirements]
      summary: Compare two immutable requirement revisions
      security:
        - bearerAuth: []
      parameters:
        - name: from_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: to_revision
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Revision comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementComparison"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/import:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
      - $ref: "#/components/parameters/IdempotencyHeader"
    post:
      operationId: importRequirements
      tags: [Requirements]
      summary: Import up to 100 requirements using idempotent row commands
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequirementImportRequest"
      responses:
        "201":
          description: Imported requirements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementImportResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/export:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: exportRequirements
      tags: [Requirements]
      summary: Export all current requirements as JSON
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Complete current requirement export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationship-types:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationshipTypes
      tags: [Traceability]
      summary: List directed relationship rules configured for a project
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Project-scoped relationship types and cardinality rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipTypeListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationships
      tags: [Traceability]
      summary: List directed relationships, optionally around one artifact
      security:
        - bearerAuth: []
      parameters:
        - name: artifact_id
          in: query
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          description: Source means outgoing; target means incoming.
          schema:
            type: string
            enum: [both, source, target]
            default: both
      responses:
        "200":
          description: Current typed relationships bound to exact endpoint revisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRelationship
      tags: [Traceability]
      summary: Create a directed relationship at the endpoints' current revisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRelationshipRequest"
      responses:
        "200":
          description: Idempotent replay of an existing successful command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "201":
          description: Directed relationship created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships/{relationship_id}/resolve:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/OrganizationHeader"
      - $ref: "#/components/parameters/IdempotencyHeader"
    post:
      operationId: resolveSuspectRelationship
      tags: [Traceability]
      summary: Record a reviewer disposition against exact endpoint revisions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRelationshipRequest"
      responses:
        "200":
          description: Suspect impact resolved, or an idempotent replay returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relationship"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/relationships/{relationship_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RelationshipId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRelationshipRevisions
      tags: [Traceability]
      summary: List immutable relationship versions newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attributable relationship version history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token. Outside production, development mode accepts dev:<subject> and dev:<subject>:<project-role>.
  parameters:
    OrganizationHeader:
      name: X-OpenRM-Organization
      in: header
      required: true
      description: Organization UUID selected for the request.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequirementId:
      name: requirement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationship_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [folders, tags, attribute-definitions, saved-views]
    IdempotencyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable client command identifier scoped to tenant, actor, and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The principal is not authorized for the selected tenant or action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The selected project or requirement does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The command conflicts with current state or prior idempotency evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BuildInfo:
      type: object
      additionalProperties: false
      required: [service, version, git_sha, profile]
      properties:
        service:
          type: string
          const: openrm-api
        version:
          type: string
        git_sha:
          type: string
        profile:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, build, timestamp]
      properties:
        status:
          type: string
          const: ok
        build:
          $ref: "#/components/schemas/BuildInfo"
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: available
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      additionalProperties: false
      required: [subject, organization_id, roles, database]
      properties:
        subject:
          type: string
        organization_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [administrator, author, reviewer, viewer]
        database:
          type: string
          const: available
    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9-]{1,15}$"
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
          default: ""
    ProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [subject, role]
      properties:
        subject:
          type: string
        role:
          type: string
          enum: [administrator, author, reviewer, viewer]
    ProjectMembership:
      type: object
      additionalProperties: false
      required: [subject, role, created_at]
      properties:
        subject:
          type: string
        role:
          type: string
          enum: [administrator, author, reviewer, viewer]
        created_at:
          type: string
          format: date-time
    ProjectMembershipListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
    WorkspaceResourceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        parent_id:
          type: [string, "null"]
