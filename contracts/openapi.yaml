openapi: 3.1.0
info:
  title: OpenRM API
  version: 0.1.0
  description: >-
    Versioned foundation contract for OpenRM. All controlled product endpoints
    live under /api/v1; health and readiness endpoints remain operational.
servers:
  - url: http://127.0.0.1:8080
    description: Local development
tags:
  - name: Operations
  - name: Identity
  - name: Projects
  - name: Requirements
paths:
  /health:
    get:
      operationId: getHealth
      tags: [Operations]
      summary: Report process liveness and build metadata
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      operationId: getReadiness
      tags: [Operations]
      summary: Verify that required dependencies are available
      responses:
        "200":
          description: The service and database are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/session:
    get:
      operationId: getSession
      tags: [Identity]
      summary: Verify authentication, tenant scope, policy, and database access
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Authenticated principal and database status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects in the selected organization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Tenant-scoped projects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirements
      tags: [Requirements]
      summary: Search and page through current requirements
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current requirement results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: createRequirement
      tags: [Requirements]
      summary: Create a controlled requirement and its first revision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequirementRequest"
      responses:
        "200":
          description: Idempotent replay of an existing successful command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "201":
          description: Requirement created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: getRequirement
      tags: [Requirements]
      summary: Read the current materialized requirement
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    put:
      operationId: reviseRequirement
      tags: [Requirements]
      summary: Append a revision using optimistic concurrency
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviseRequirementRequest"
      responses:
        "200":
          description: Revised requirement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Requirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/requirements/{requirement_id}/revisions:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/RequirementId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listRequirementRevisions
      tags: [Requirements]
      summary: List immutable requirement revisions newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Requirement revision history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequirementRevisionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token. Development mode accepts only dev:<subject> outside production.
  parameters:
    OrganizationHeader:
      name: X-OpenRM-Organization
      in: header
      required: true
      description: Organization UUID selected for the request.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequirementId:
      name: requirement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable client command identifier scoped to tenant, actor, and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The principal is not authorized for the selected tenant or action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The selected project or requirement does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The command conflicts with current state or prior idempotency evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BuildInfo:
      type: object
      additionalProperties: false
      required: [service, version, git_sha, profile]
      properties:
        service:
          type: string
          const: openrm-api
        version:
          type: string
        git_sha:
          type: string
        profile:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, build, timestamp]
      properties:
        status:
          type: string
          const: ok
        build:
          $ref: "#/components/schemas/BuildInfo"
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: available
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      additionalProperties: false
      required: [subject, organization_id, roles, database]
      properties:
        subject:
          type: string
        organization_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [administrator, author, reviewer, viewer]
        database:
          type: string
          const: available
    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    Requirement:
      type: object
      additionalProperties: false
      required:
        - id
        - project_id
        - key
        - title
        - statement
        - attributes
        - revision
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        key:
          type: string
        title:
          type: string
        statement:
          type: string
        attributes:
          type: object
          additionalProperties: true
        revision:
          type: integer
          minimum: 1
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    RequirementListResponse:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Requirement"
        total:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
    CreateRequirementRequest:
      type: object
      additionalProperties: false
      required: [key, title, statement]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9-]{1,31}$"
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
          minLength: 1
          maxLength: 20000
        attributes:
          type: object
          additionalProperties: true
          default: {}
    ReviseRequirementRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, title, statement]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 200
        statement:
          type: string
          minLength: 1
          maxLength: 20000
        attributes:
          type: object
          additionalProperties: true
          default: {}
    RequirementRevision:
      type: object
      additionalProperties: false
      required: [id, revision, title, statement, attributes, created_by, created_at]
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        statement:
          type: string
        attributes:
          type: object
          additionalProperties: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
    RequirementRevisionListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/RequirementRevision"
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
          format: uuid
        details: {}

