      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      operationId: listJiraDeliveries
      tags: [Connectors]
      summary: List Jira delivery state and append-only attempt evidence
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ConnectorDeliveryStatus"
      responses:
        "200":
          description: Jira deliveries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraDeliveryListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      operationId: enqueueJiraDelivery
      tags: [Connectors]
      summary: Enqueue an idempotent governed Jira delivery
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnqueueJiraDeliveryRequest"
      responses:
        "200":
          description: Idempotent replay of an existing delivery.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraDelivery"
        "201":
          description: Delivery enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraDelivery"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/projects/{project_id}/connectors/jira/deliveries/{delivery_id}/replay:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - $ref: "#/components/parameters/DeliveryId"
      - $ref: "#/components/parameters/OrganizationHeader"
    post:
      operationId: replayJiraDelivery
      tags: [Connectors]
      summary: Replay a dead-letter Jira delivery with attributable audit evidence
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Delivery returned to the pending queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JiraDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OIDC access token. Outside production, development mode accepts dev:<subject> and dev:<subject>:<project-role>.
  parameters:
    OrganizationHeader:
      name: X-OpenRM-Organization
      in: header
      required: true
      description: Organization UUID selected for the request.
      schema:
        type: string
        format: uuid
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequirementId:
      name: requirement_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RelationshipId:
      name: relationship_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChangesetId:
      name: changeset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BaselineId:
      name: baseline_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: review_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationCaseId:
      name: case_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VerificationRunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliveryId:
      name: delivery_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceResource:
      name: resource
      in: path
      required: true
      schema:
        type: string
        enum: [folders, tags, attribute-definitions, saved-views]
    IdempotencyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      description: Stable client command identifier scoped to tenant, actor, and operation.
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: The principal is not authorized for the selected tenant or action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    BadRequest:
      description: The request failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: The selected project or requirement does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: The command conflicts with current state or prior idempotency evidence.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServiceUnavailable:
      description: A required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    BuildInfo:
      type: object
      additionalProperties: false
      required: [service, version, git_sha, profile]
      properties:
        service:
          type: string
          const: openrm-api
        version:
          type: string
        git_sha:
          type: string
        profile:
          type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, build, timestamp]
      properties:
        status:
          type: string
          const: ok
        build:
          $ref: "#/components/schemas/BuildInfo"
        timestamp:
          type: string
          format: date-time
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, database, timestamp]
      properties:
        status:
          type: string
          const: ready
        database:
          type: string
          const: available
        timestamp:
          type: string
          format: date-time
    SessionResponse:
      type: object
      additionalProperties: false
      required: [subject, organization_id, roles, database]
      properties:
        subject:
          type: string
        organization_id:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum: [administrator, author, reviewer, viewer]
        database:
          type: string
          const: available
    Project:
      type: object
      additionalProperties: false
      required: [id, key, name, description, created_at]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9-]{1,15}$"
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
          default: ""
    ProjectMembershipRequest:
      type: object
      additionalProperties: false
      required: [subject, role]
      properties:
        subject:
          type: string
        role:
          type: string
          enum: [administrator, author, reviewer, viewer]
    ProjectMembership:
      type: object
      additionalProperties: false
      required: [subject, role, created_at]
      properties:
        subject:
          type: string
        role:
          type: string
