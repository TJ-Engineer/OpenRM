AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Content-only deployment role for the OpenCM demo. Infrastructure is
  provisioned separately with a temporary administrative session. This role
  can upload the built site, read one stack, and invalidate one tagged
  CloudFront distribution; it cannot modify infrastructure or IAM.

Parameters:
  RoleName:
    Type: String
    Default: OpenCMDeploymentRole
    AllowedPattern: "^[A-Za-z0-9+=,.@_-]{1,64}$"

  SiteStackName:
    Type: String
    Default: opencm-demo
    AllowedPattern: "^opencm-[a-z0-9-]{1,20}$"

  ProjectName:
    Type: String
    Default: opencm
    AllowedPattern: "^opencm[a-z0-9-]{0,14}$"

  EnvironmentName:
    Type: String
    Default: demo
    AllowedPattern: "^[a-z][a-z0-9-]{1,9}$"

Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Content-only deployment role for the OpenCM preview
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOnlyThisAccountsRootSession
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: sts:AssumeRole
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub >-
                  arn:${AWS::Partition}:iam::${AWS::AccountId}:root
      Policies:
        - PolicyName: OpenCMContentDeploymentPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadOpenCMSiteStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SiteStackName}/*
              - Sid: ListExactOpenCMBucket
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}
              - Sid: DeployOpenCMSiteObjects
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:ListMultipartUploadParts
                  - s3:PutObject
                Resource: !Sub >-
                  arn:${AWS::Partition}:s3:::${ProjectName}-${EnvironmentName}-${AWS::AccountId}-${AWS::Region}/*
              - Sid: InvalidateTaggedOpenCMDistribution
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub >-
                  arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/*
                Condition:
                  StringEquals:
                    aws:ResourceTag/Project: !Ref ProjectName
                    aws:ResourceTag/Environment: !Ref EnvironmentName
              - Sid: VerifyCaller
                Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: "*"
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RoleArn:
    Description: ARN of the content-only OpenCM deployment role.
    Value: !GetAtt DeploymentRole.Arn
