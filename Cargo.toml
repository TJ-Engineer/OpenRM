[workspace]
members = ["apps/api"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http = "1"
http-body-util = "0.1"
hmac = "0.12"
hex = "0.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
opentelemetry = { version = "0.33.1", features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "reqwest-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio", "trace"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "cors", "request-id", "sensitive-headers", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
strip = "symbols"

