name: openrm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openrm
      POSTGRES_USER: openrm
      POSTGRES_PASSWORD: openrm
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openrm -d openrm"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - openrm-postgres:/var/lib/postgresql/data

volumes:
  openrm-postgres:

